<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Apply for a Loan - JantaCredit</title>
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background-color: #00211d;
      color: #e5f9f4;
    }

    header {
      text-align: center;
      padding: 2rem 0;
      background-color: #00352e;
      border-bottom: 2px solid #00dca0;
    }

    header h1 {
      font-weight: 900;
      color: #ffffff;
    }

    header span {
      color: #00dca0;
    }

    header p {
      color: #d6fff7;
    }

    nav {
      background-color: #00352e;
      padding: 0.5rem 1rem;
    }

    .navbar li {
      display: inline;
      margin-right: 1rem;
    }

    .navbar a {
      color: #d6fff7;
      text-decoration: none;
    }

    .navbar a:hover {
      color: #00dca0;
    }

    section {
      padding: 2rem;
    }

    form {
      max-width: 700px;
      margin: auto;
      background-color: #00453b;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0, 255, 153, 0.1);
    }

    form h2 {
      color: #00dca0;
      margin-top: 1.5rem;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 0.6rem;
      margin-top: 0.3rem;
      background-color: #002e28;
      border: 1px solid #00dca0;
      border-radius: 0.5rem;
      color: #ffffff;
    }

    input:focus {
      outline: none;
      border-color: #00ffbf;
      box-shadow: 0 0 5px #00ffbf;
    }

    .btn {
      margin-top: 2rem;
      background-color: #00dca0;
      color: #00211d;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: bold;
    }

    .btn:hover {
      background-color: #00ffbf;
    }

    .eligible-box {
      text-align: center;
      font-size: 1.25rem;
      background-color: #00352e;
      padding: 1rem;
      border: 2px solid #00dca0;
      border-radius: 0.5rem;
      margin-bottom: 2rem;
    }

    footer {
      text-align: center;
      background-color: #00352e;
      padding: 1rem;
      color: #d6fff7;
      border-top: 1px solid #00dca0;
    }
  </style>
</head>
<body>
  <header>
    <h1><span>Janta</span>Credit</h1>
    <p><i class="fa-solid fa-file-signature"></i> Apply for a Loan</p>
  </header>

  <!-- Navigation -->
  <nav>
    <ul class="navbar">
      <li><a href="index.html"><i class="fa-solid fa-house me-1"></i> Home</a></li>
      <li><a href="dashboard.html"><i class="fa-solid fa-gauge me-1"></i> Dashboard</a></li>
      <li><a href="profile.html"><i class="fa-solid fa-user me-1"></i> Profile</a></li>
    </ul>
  </nav>

  <section>
    <div class="eligible-box">
      <strong>Eligible Loan Amount:</strong> ₹15,000
    </div>

    <form>
      <h2><i class="fa-solid fa-user"></i> Applicant Details</h2>

      <label><i class="fa-solid fa-user"></i> Name:</label>
      <input type="text" name="applicant_name" required />

      <label><i class="fa-solid fa-phone"></i> Phone Number:</label>
      <input type="tel" name="applicant_phone" required />

      <label><i class="fa-solid fa-id-card"></i> Aadhaar Number:</label>
      <input type="text" name="applicant_aadhaar" required />

      <label><i class="fa-solid fa-address-card"></i> PAN Number:</label>
      <input type="text" name="applicant_pan" required />

      <label><i class="fa-solid fa-indian-rupee-sign"></i> Desired Loan Amount (₹):</label>
      <input type="number" name="loan_amount" required />

      <h2><i class="fa-solid fa-users"></i> Guarantor 1</h2>

      <label><i class="fa-solid fa-user"></i> Name:</label>
      <input type="text" name="g1_name" required />

      <label><i class="fa-solid fa-phone"></i> Phone Number:</label>
      <input type="tel" name="g1_phone" required />

      <label><i class="fa-solid fa-id-card"></i> Aadhaar Number:</label>
      <input type="text" name="g1_aadhaar" required />

      <h2><i class="fa-solid fa-users"></i> Guarantor 2</h2>

      <label><i class="fa-solid fa-user"></i> Name:</label>
      <input type="text" name="g2_name" required />

      <label><i class="fa-solid fa-phone"></i> Phone Number:</label>
      <input type="tel" name="g2_phone" required />

      <label><i class="fa-solid fa-id-card"></i> Aadhaar Number:</label>
      <input type="text" name="g2_aadhaar" required />

      <h2><i class="fa-solid fa-users"></i> Guarantor 3</h2>

      <label><i class="fa-solid fa-user"></i> Name:</label>
      <input type="text" name="g3_name" required />

      <label><i class="fa-solid fa-phone"></i> Phone Number:</label>
      <input type="tel" name="g3_phone" required />

      <label><i class="fa-solid fa-id-card"></i> Aadhaar Number:</label>
      <input type="text" name="g3_aadhaar" required />

      <button type="submit" class="btn">
        <i class="fa-solid fa-paper-plane"></i> Submit Application
      </button>

      <p id="successMessage" style="display: none; color: #00ffbf; font-weight: bold; margin-top: 1rem;">
        🎉 Application submitted successfully!
      </p>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 JantaCredit. All rights reserved.</p>
  </footer>

  <script>
    const form = document.querySelector("form");
    const message = document.getElementById("successMessage");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      message.style.display = "block";
      form.reset();
    });
  </script>
</body>
</html>
