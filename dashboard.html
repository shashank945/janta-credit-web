<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard - JantaCredit</title>
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background-color: #00211d;
      color: #e5f9f4;
    }

    .navbar,
    .footer,
    .card-box,
    header {
      background-color: #00352e !important;
    }

    .navbar a,
    .footer,
    .nav-link,
    header h1,
    header p {
      color: #d6fff7 !important;
    }

    .navbar .nav-link.active,
    .navbar .nav-link:hover {
      color: #00dca0 !important;
    }

    header {
      text-align: center;
      padding: 2rem 0;
      border-bottom: 1px solid #00dca0;
    }

    .card-box {
      background-color: #00453b;
      border-radius: 1rem;
      padding: 1.5rem;
      color: #e5f9f4;
      box-shadow: 0 0 10px rgba(0, 255, 153, 0.1);
    }

    .card-box h4 {
      color: #00dca0;
    }

    .text-success {
      color: #00ffbf !important;
    }

    .text-warning {
      color: #ffcc00 !important;
    }

    .text-primary {
      color: #66b3ff !important;
    }

    .text-muted {
      color: #b2e0d3 !important;
    }

    .apply-btn {
      margin-top: 2rem;
    }

    footer {
      border-top: 1px solid #00dca0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1><strong>Janta</strong><span style="color: #00dca0">Credit</span></h1>
    <p class="lead"><i class="fa-solid fa-gauge me-2"></i>User Dashboard</p>
  </header>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg border-bottom border-success">
    <div class="container">
      <a class="navbar-brand text-success" href="#">JantaCredit</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i>Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="profile.html"><i class="fa-solid fa-user me-1"></i>Profile</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Greeting -->
  <div class="container text-center mt-4">
    <h2 id="greeting" class="fw-bold text-success">Hello, User!</h2>
  </div>

  <!-- Dashboard Content -->
  <main class="container my-5">
    <div class="row g-4">

      <!-- Active Loan -->
      <div class="col-md-4">
        <div class="card-box text-center">
          <h4><i class="fa-solid fa-money-bill-wave me-2"></i>Active Loan</h4>
          <p class="display-6 text-success mt-3">₹ 10,000</p>
          <p class="small text-muted">Disbursed on: Apr 1, 2025</p>
        </div>
      </div>

      <!-- EMI -->
      <div class="col-md-4">
        <div class="card-box text-center">
          <h4><i class="fa-solid fa-calendar-days me-2"></i>Monthly EMI</h4>
          <p class="display-6 text-warning mt-3">₹ 1,100</p>
          <p class="small text-muted">Next due: Apr 30, 2025</p>
        </div>
      </div>

      <!-- Credit Score -->
      <div class="col-md-4">
        <div class="card-box text-center">
          <h4><i class="fa-solid fa-chart-line me-2"></i>Credit Score</h4>
          <p class="display-6 text-primary mt-3">735</p>
          <p class="small text-muted">Good standing</p>
        </div>
      </div>

    </div>

    <!-- Apply for Loan Button -->
    <div class="text-center apply-btn">
      <a href="apply.html" class="btn btn-success btn-lg">
        <i class="fa-solid fa-file-signature me-2"></i>Apply for Loan
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-3 footer">
    <p class="mb-0">&copy; 2025 JantaCredit. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Personalized Greeting Script -->
  <script>
    const userName = localStorage.getItem('userName');
    const greetingEl = document.getElementById('greeting');

    if (userName) {
      greetingEl.textContent = `Hello, ${userName}!`;
    }
  </script>
</body>
</html>
