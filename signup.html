<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - JantaCredit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #1e1f22;
      color: #ffffff;
    }
    header {
      background-color: #00231d;
    }
    .custom-card {
      background-color: #00372e;
      color: #ffffff;
    }
    .form-control {
      background-color: #1e1f22;
      border: 1px solid #444;
      color: #ffffff;
    }
    .form-control:focus {
      border-color: #198754;
      box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
    }
    .form-label {
      color: #e0e0e0;
    }
    a.text-success {
      color: #20c997 !important;
    }
    a.text-success:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header class="text-center py-4 border-bottom border-success">
    <h1 class="fw-bold"><span class="text-white">Janta</span><span class="text-success">Credit</span></h1>
    <p class="lead"><i class="fa-solid fa-user-plus me-2"></i>Create Your Account</p>
  </header>

  <main class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card custom-card shadow-lg p-4 rounded-4 w-100" style="max-width: 420px;">
      <form id="signupForm">
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold"><i class="fa-solid fa-user me-2"></i>Full Name</label>
          <input type="text" id="name" name="name" class="form-control rounded-3" required>
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label fw-semibold"><i class="fa-solid fa-phone me-2"></i>Phone</label>
          <input type="text" id="phone" name="phone" class="form-control rounded-3" required>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold"><i class="fa-solid fa-lock me-2"></i>Password</label>
          <input type="password" id="password" name="password" class="form-control rounded-3" required>
        </div>

        <button type="submit" class="btn btn-success w-100 fw-semibold rounded-3">
          <i class="fa-solid fa-user-plus me-2"></i>Sign Up
        </button>

        <p class="text-center mt-3 mb-0">Already have an account?
          <a href="login.html" class="text-success fw-semibold">Login here</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3 border-top border-success mt-5">
    <p class="mb-0">&copy; 2025 JantaCredit. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const signupButton = e.target.querySelector('button[type="submit"]');
      signupButton.disabled = true;
      signupButton.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i>Signing Up...`;

      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('https://janta-credit-web.onrender.com/api/auth/register', {  // Updated URL
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('userName', name);
          alert('✅ Registration successful! Redirecting to login...');
          window.location.href = 'login.html';
        } else {
          alert('❌ ' + (data.error || 'Registration failed'));
        }
      } catch (err) {
        alert('⚠️ Error connecting to server. Make sure the backend is running.');
        console.error(err);
      } finally {
        signupButton.disabled = false;
        signupButton.innerHTML = `<i class="fa-solid fa-user-plus me-2"></i>Sign Up`;
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
