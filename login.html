<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - JantaCredit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

  <!-- Header -->
  <header class="text-center py-4 border-bottom border-success" style="background-color: #002620;">
    <h1 class="fw-bold mb-0">
      <span class="text-white">Janta</span><span class="text-success">Credit</span>
    </h1>
    <p class="lead text-success"><i class="fa-solid fa-right-to-bracket me-2"></i>Login</p>
  </header>

  <!-- Main Content -->
  <main class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4 rounded-4" style="width: 100%; max-width: 400px; background-color: #013029; color: #ffffff;">
      <form id="loginForm">
        <div class="mb-3">
          <label for="phone" class="form-label fw-semibold text-light"><i class="fa-solid fa-phone me-2"></i>Phone</label>
          <input type="text" id="phone" name="phone" class="form-control bg-dark text-white border-success rounded-3" required placeholder="Enter your phone number">
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold text-light"><i class="fa-solid fa-lock me-2"></i>Password</label>
          <input type="password" id="password" name="password" class="form-control bg-dark text-white border-success rounded-3" required placeholder="Enter your password">
        </div>

        <button type="submit" class="btn btn-success w-100 fw-semibold rounded-3" id="loginBtn">
          <i class="fa-solid fa-right-to-bracket me-2"></i>Login
        </button>

        <p class="text-center mt-3 mb-0 text-light">Don't have an account?
          <a href="signup.html" class="text-success fw-semibold">Sign up here</a>
        </p>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 border-top border-success">
    <p class="mb-0">&copy; 2025 JantaCredit. All rights reserved.</p>
  </footer>

  <!-- JS Logic -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = true;
      loginBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i>Logging In...`;

      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!phone || !password) {
        alert('⚠️ Please enter both phone number and password.');
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-2"></i>Login`;
        return;
      }

      try {
        const res = await fetch('https://janta-credit-web.onrender.com/api/auth/login', {  // Updated URL
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });

        const data = await res.json();

        if (res.ok) {
          // Save name to localStorage for dashboard
          if (data.name) {
            localStorage.setItem('userName', data.name);
          }

          alert('✅ Login successful!');
          window.location.href = 'dashboard.html';
        } else {
          alert('❌ ' + (data.error || 'Login failed'));
        }
      } catch (err) {
        alert('⚠️ Error connecting to server. Please ensure your backend is running.');
        console.error('[Login Error]', err);
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-2"></i>Login`;
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
